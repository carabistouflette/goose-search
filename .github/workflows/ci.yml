name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .toolchain
          key: goose-${{ runner.os }}-${{ hashFiles('GOOSE_REVISION', 'scripts/setup-goose.sh') }}
      - run: sudo apt-get update && sudo apt-get install -y libpcre2-dev pkg-config clang time
      - run: make setup
      - run: make check test native test-races CC=${{ matrix.cc }}
      - run: make sanitize sanitize-races CC=${{ matrix.cc }}
      - run: make analyze bench-smoke CC=${{ matrix.cc }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: search-smoke-${{ matrix.cc }}-${{ github.sha }}
          path: .build/bench-smoke/report.json
          include-hidden-files: true
          if-no-files-found: error
